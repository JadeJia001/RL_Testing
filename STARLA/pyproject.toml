[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starla"
version = "0.1.0"
description = "STARLA modernized RL testing framework scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "stable-baselines3>=2.4.0",
  "gymnasium>=1.0.0",
  "pymoo>=0.6.1",
  "scikit-learn>=1.5.0",
  "numpy>=1.26",
  "pandas>=2.2.0",
  "matplotlib>=3.9.0",
  "torch>=2.2.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
